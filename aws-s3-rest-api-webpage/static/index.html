<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercedes Gallery</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .gallery img {
            width: 350px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Welcome to My Mercedes Gallery</h1>
    <p>Hosted securely on AWS S3 via HTTPS REST API</p>

    <div class="gallery">
        <img src="images/mercedes-1.jpg" alt="Mercedes 1">
        <img src="images/mercedes-2.jpg" alt="Mercedes 2">
        <img src="images/mercedes-3.jpg" alt="Mercedes 3">
    </div>

</body>
</html>
